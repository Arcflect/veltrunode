---
AWSTemplateFormatVersion: '2010-09-09'
Description: alarmed-service - dev (compiled by Veltrunode v0.1.77)
Parameters:
  AlertTopic:
    Description: SNS topic ARN for AlertTopic
    Type: String
  ArtifactBucket:
    Description: S3 bucket name where function and layer zip packages are stored
    Type: String
Resources:
  WorkerFunction:
    DependsOn:
    - WorkerFunctionLogGroup
    Properties:
      Architectures:
      - arm64
      Code:
        S3Bucket:
          Ref: ArtifactBucket
        S3Key: artifacts/functions/worker.zip
      EphemeralStorage:
        Size: 512
      FunctionName: worker
      Handler: functions/worker.handler
      MemorySize: 1024
      Role:
        Fn::GetAtt:
        - WorkerFunctionRole
        - Arn
      Runtime: ruby3.4
      Timeout: 60
    Type: AWS::Lambda::Function
  WorkerFunctionDurationAlarm:
    Properties:
      AlarmActions:
      - Ref: AlertTopic
      AlarmDescription: CloudWatch Alarm for worker Duration
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Dimensions:
      - Name: FunctionName
        Value:
          Ref: WorkerFunction
      EvaluationPeriods: 1
      MetricName: Duration
      Namespace: AWS/Lambda
      Period: 60
      Statistic: Average
      Threshold: 30000
      TreatMissingData: notBreaching
    Type: AWS::CloudWatch::Alarm
  WorkerFunctionErrorsAlarm:
    Properties:
      AlarmActions:
      - Ref: AlertTopic
      AlarmDescription: CloudWatch Alarm for worker Errors
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Dimensions:
      - Name: FunctionName
        Value:
          Ref: WorkerFunction
      EvaluationPeriods: 1
      MetricName: Errors
      Namespace: AWS/Lambda
      Period: 60
      Statistic: Sum
      Threshold: 1
      TreatMissingData: notBreaching
    Type: AWS::CloudWatch::Alarm
  WorkerFunctionLogGroup:
    Properties:
      LogGroupName: "/aws/lambda/worker"
      RetentionInDays: 30
    Type: AWS::Logs::LogGroup
  WorkerFunctionRole:
    Properties:
      AssumeRolePolicyDocument:
        Statement:
        - Action: sts:AssumeRole
          Effect: Allow
          Principal:
            Service: lambda.amazonaws.com
        Version: '2012-10-17'
      Policies:
      - PolicyDocument:
          Statement:
          - Action:
            - logs:CreateLogStream
            - logs:PutLogEvents
            Effect: Allow
            Resource:
            - Fn::GetAtt:
              - WorkerFunctionLogGroup
              - Arn
          Version: '2012-10-17'
        PolicyName: WorkerFunctionRolePolicy
    Type: AWS::IAM::Role
  WorkerFunctionThrottlesAlarm:
    Properties:
      AlarmActions:
      - Ref: AlertTopic
      AlarmDescription: CloudWatch Alarm for worker Throttles
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Dimensions:
      - Name: FunctionName
        Value:
          Ref: WorkerFunction
      EvaluationPeriods: 1
      MetricName: Throttles
      Namespace: AWS/Lambda
      Period: 60
      Statistic: Sum
      Threshold: 5
      TreatMissingData: notBreaching
    Type: AWS::CloudWatch::Alarm
Outputs:
  ApplicationName:
    Description: Veltrunode application name
    Value: alarmed-service
  ApplicationStage:
    Description: Veltrunode application stage
    Value: dev
  WorkerFunctionArn:
    Description: ARN of worker Lambda function
    Export:
      Name:
        Fn::Sub: "${AWS::StackName}-WorkerFunctionArn"
    Value:
      Fn::GetAtt:
      - WorkerFunction
      - Arn
  WorkerFunctionName:
    Description: Name of worker Lambda function
    Export:
      Name:
        Fn::Sub: "${AWS::StackName}-WorkerFunctionName"
    Value:
      Ref: WorkerFunction
