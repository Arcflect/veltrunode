---
AWSTemplateFormatVersion: '2010-09-09'
Description: minimal-app - dev (compiled by Veltrunode v0.1.39)
Parameters:
  ArtifactBucket:
    Description: S3 bucket name where function and layer zip packages are stored
    Type: String
Resources:
  HeartbeatSchedule:
    Properties:
      FlexibleTimeWindow:
        Mode: 'OFF'
      ScheduleExpression: cron(0 12 * * ? *)
      ScheduleExpressionTimezone: UTC
      State: ENABLED
      Target:
        Arn:
          Fn::GetAtt:
          - WorkerFunction
          - Arn
        RoleArn:
          Fn::GetAtt:
          - HeartbeatScheduleRole
          - Arn
    Type: AWS::Scheduler::Schedule
  HeartbeatScheduleRole:
    Properties:
      AssumeRolePolicyDocument:
        Statement:
        - Action: sts:AssumeRole
          Effect: Allow
          Principal:
            Service: scheduler.amazonaws.com
        Version: '2012-10-17'
      Policies:
      - PolicyDocument:
          Statement:
          - Action:
            - lambda:InvokeFunction
            Effect: Allow
            Resource:
            - Fn::GetAtt:
              - WorkerFunction
              - Arn
          Version: '2012-10-17'
        PolicyName: HeartbeatScheduleRolePolicy
    Type: AWS::IAM::Role
  WorkerFunction:
    DependsOn:
    - WorkerFunctionLogGroup
    Properties:
      Architectures:
      - x86_64
      Code:
        S3Bucket:
          Ref: ArtifactBucket
        S3Key: artifacts/functions/worker.zip
      EphemeralStorage:
        Size: 512
      FunctionName: worker
      Handler: app.handler
      MemorySize: 128
      Role:
        Fn::GetAtt:
        - WorkerFunctionRole
        - Arn
      Runtime: ruby3.3
      Timeout: 30
    Type: AWS::Lambda::Function
  WorkerFunctionLogGroup:
    Properties:
      LogGroupName: "/aws/lambda/worker"
      RetentionInDays: 30
    Type: AWS::Logs::LogGroup
  WorkerFunctionRole:
    Properties:
      AssumeRolePolicyDocument:
        Statement:
        - Action: sts:AssumeRole
          Effect: Allow
          Principal:
            Service: lambda.amazonaws.com
        Version: '2012-10-17'
      Policies:
      - PolicyDocument:
          Statement:
          - Action:
            - logs:CreateLogStream
            - logs:PutLogEvents
            Effect: Allow
            Resource:
            - Fn::GetAtt:
              - WorkerFunctionLogGroup
              - Arn
          Version: '2012-10-17'
        PolicyName: WorkerFunctionRolePolicy
    Type: AWS::IAM::Role
Outputs:
  ApplicationName:
    Description: Veltrunode application name
    Value: minimal-app
  ApplicationStage:
    Description: Veltrunode application stage
    Value: dev
  HeartbeatScheduleArn:
    Description: ARN of heartbeat EventBridge schedule
    Export:
      Name:
        Fn::Sub: "${AWS::StackName}-HeartbeatScheduleArn"
    Value:
      Fn::GetAtt:
      - HeartbeatSchedule
      - Arn
  WorkerFunctionArn:
    Description: ARN of worker Lambda function
    Export:
      Name:
        Fn::Sub: "${AWS::StackName}-WorkerFunctionArn"
    Value:
      Fn::GetAtt:
      - WorkerFunction
      - Arn
  WorkerFunctionName:
    Description: Name of worker Lambda function
    Export:
      Name:
        Fn::Sub: "${AWS::StackName}-WorkerFunctionName"
    Value:
      Ref: WorkerFunction
