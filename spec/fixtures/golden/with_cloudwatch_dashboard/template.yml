---
AWSTemplateFormatVersion: '2010-09-09'
Description: with-cloudwatch-dashboard - dev (compiled by Veltrunode v0.1.74)
Parameters:
  ArtifactBucket:
    Description: S3 bucket name where function and layer zip packages are stored
    Type: String
Resources:
  ApiFunction:
    DependsOn:
    - ApiFunctionLogGroup
    Properties:
      Architectures:
      - x86_64
      Code:
        S3Bucket:
          Ref: ArtifactBucket
        S3Key: artifacts/functions/api.zip
      EphemeralStorage:
        Size: 512
      FunctionName: api
      Handler: handlers/api.handler
      MemorySize: 512
      Role:
        Fn::GetAtt:
        - ApiFunctionRole
        - Arn
      Runtime: ruby3.3
      Timeout: 30
    Type: AWS::Lambda::Function
  ApiFunctionLogGroup:
    Properties:
      LogGroupName: "/aws/lambda/api"
      RetentionInDays: 30
    Type: AWS::Logs::LogGroup
  ApiFunctionRole:
    Properties:
      AssumeRolePolicyDocument:
        Statement:
        - Action: sts:AssumeRole
          Effect: Allow
          Principal:
            Service: lambda.amazonaws.com
        Version: '2012-10-17'
      Policies:
      - PolicyDocument:
          Statement:
          - Action:
            - logs:CreateLogStream
            - logs:PutLogEvents
            Effect: Allow
            Resource:
            - Fn::GetAtt:
              - ApiFunctionLogGroup
              - Arn
          Version: '2012-10-17'
        PolicyName: ApiFunctionRolePolicy
    Type: AWS::IAM::Role
  Dashboard:
    Properties:
      DashboardBody:
        Fn::Sub: '{"widgets":[{"height":6,"properties":{"metrics":[["AWS/Lambda","Invocations","FunctionName","${ApiFunction}"],["AWS/Lambda","Invocations","FunctionName","${WorkerFunction}"]],"period":300,"region":"${AWS::Region}","stacked":false,"stat":"Sum","title":"Invocations","view":"timeSeries"},"type":"metric","width":12,"x":0,"y":0},{"height":6,"properties":{"metrics":[["AWS/Lambda","Errors","FunctionName","${ApiFunction}"],["AWS/Lambda","Errors","FunctionName","${WorkerFunction}"]],"period":300,"region":"${AWS::Region}","stacked":false,"stat":"Sum","title":"Errors","view":"timeSeries"},"type":"metric","width":12,"x":12,"y":0},{"height":6,"properties":{"metrics":[["AWS/Lambda","Duration","FunctionName","${ApiFunction}"],["AWS/Lambda","Duration","FunctionName","${WorkerFunction}"]],"period":300,"region":"${AWS::Region}","stacked":false,"stat":"Average","title":"Duration","view":"timeSeries"},"type":"metric","width":12,"x":0,"y":6},{"height":6,"properties":{"metrics":[["AWS/Lambda","ConcurrentExecutions","FunctionName","${ApiFunction}"],["AWS/Lambda","ConcurrentExecutions","FunctionName","${WorkerFunction}"]],"period":300,"region":"${AWS::Region}","stacked":false,"stat":"Maximum","title":"Concurrent
          Executions","view":"timeSeries"},"type":"metric","width":12,"x":12,"y":6}]}'
      DashboardName:
        Fn::Sub: "${AWS::StackName}-Dashboard"
    Type: AWS::CloudWatch::Dashboard
  WorkerFunction:
    DependsOn:
    - WorkerFunctionLogGroup
    Properties:
      Architectures:
      - x86_64
      Code:
        S3Bucket:
          Ref: ArtifactBucket
        S3Key: artifacts/functions/worker.zip
      EphemeralStorage:
        Size: 512
      FunctionName: worker
      Handler: handlers/worker.handler
      MemorySize: 256
      Role:
        Fn::GetAtt:
        - WorkerFunctionRole
        - Arn
      Runtime: ruby3.3
      Timeout: 60
    Type: AWS::Lambda::Function
  WorkerFunctionLogGroup:
    Properties:
      LogGroupName: "/aws/lambda/worker"
      RetentionInDays: 30
    Type: AWS::Logs::LogGroup
  WorkerFunctionRole:
    Properties:
      AssumeRolePolicyDocument:
        Statement:
        - Action: sts:AssumeRole
          Effect: Allow
          Principal:
            Service: lambda.amazonaws.com
        Version: '2012-10-17'
      Policies:
      - PolicyDocument:
          Statement:
          - Action:
            - logs:CreateLogStream
            - logs:PutLogEvents
            Effect: Allow
            Resource:
            - Fn::GetAtt:
              - WorkerFunctionLogGroup
              - Arn
          Version: '2012-10-17'
        PolicyName: WorkerFunctionRolePolicy
    Type: AWS::IAM::Role
Outputs:
  ApiFunctionArn:
    Description: ARN of api Lambda function
    Export:
      Name:
        Fn::Sub: "${AWS::StackName}-ApiFunctionArn"
    Value:
      Fn::GetAtt:
      - ApiFunction
      - Arn
  ApiFunctionName:
    Description: Name of api Lambda function
    Export:
      Name:
        Fn::Sub: "${AWS::StackName}-ApiFunctionName"
    Value:
      Ref: ApiFunction
  ApplicationName:
    Description: Veltrunode application name
    Value: with-cloudwatch-dashboard
  ApplicationStage:
    Description: Veltrunode application stage
    Value: dev
  DashboardUrl:
    Description: URL of CloudWatch Dashboard
    Value:
      Fn::Sub: https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards/dashboard/${Dashboard}
  WorkerFunctionArn:
    Description: ARN of worker Lambda function
    Export:
      Name:
        Fn::Sub: "${AWS::StackName}-WorkerFunctionArn"
    Value:
      Fn::GetAtt:
      - WorkerFunction
      - Arn
  WorkerFunctionName:
    Description: Name of worker Lambda function
    Export:
      Name:
        Fn::Sub: "${AWS::StackName}-WorkerFunctionName"
    Value:
      Ref: WorkerFunction
