---
AWSTemplateFormatVersion: '2010-09-09'
Description: efs-security-group-app - dev (compiled by Veltrunode v0.1.67)
Parameters:
  ArtifactBucket:
    Description: S3 bucket name where function and layer zip packages are stored
    Type: String
  VpcId:
    Description: VPC ID for EFS and Lambda security groups
    Type: AWS::EC2::VPC::Id
Resources:
  ProcessorFunction:
    DependsOn:
    - ProcessorFunctionLogGroup
    - SharedDataAccessPoint
    Properties:
      Architectures:
      - arm64
      Code:
        S3Bucket:
          Ref: ArtifactBucket
        S3Key: artifacts/functions/processor.zip
      EphemeralStorage:
        Size: 512
      FileSystemConfigs:
      - Arn:
          Fn::GetAtt:
          - SharedDataAccessPoint
          - Arn
        LocalMountPath: "/mnt/shared"
      FunctionName: processor
      Handler: app.handler
      MemorySize: 512
      Role:
        Fn::GetAtt:
        - ProcessorFunctionRole
        - Arn
      Runtime: ruby3.3
      Timeout: 60
      VpcConfig:
        SecurityGroupIds:
        - Ref: SharedStorageLambdaSecurityGroup
        SubnetIds:
        - subnet-12345678
    Type: AWS::Lambda::Function
  ProcessorFunctionLogGroup:
    Properties:
      LogGroupName: "/aws/lambda/processor"
      RetentionInDays: 30
    Type: AWS::Logs::LogGroup
  ProcessorFunctionRole:
    Properties:
      AssumeRolePolicyDocument:
        Statement:
        - Action: sts:AssumeRole
          Effect: Allow
          Principal:
            Service: lambda.amazonaws.com
        Version: '2012-10-17'
      Policies:
      - PolicyDocument:
          Statement:
          - Action:
            - logs:CreateLogStream
            - logs:PutLogEvents
            Effect: Allow
            Resource:
            - Fn::GetAtt:
              - ProcessorFunctionLogGroup
              - Arn
          - Action:
            - elasticfilesystem:ClientMount
            - elasticfilesystem:ClientWrite
            Effect: Allow
            Resource:
            - Fn::GetAtt:
              - SharedDataAccessPoint
              - Arn
          Version: '2012-10-17'
        PolicyName: ProcessorFunctionRolePolicy
    Type: AWS::IAM::Role
  SharedDataAccessPoint:
    Properties:
      FileSystemId: fs-0123456789abcdef0
      PosixUser:
        Gid: '1000'
        Uid: '1000'
      RootDirectory:
        CreationInfo:
          OwnerGid: '1000'
          OwnerUid: '1000'
          Permissions: '0755'
        Path: "/lambda"
    Type: AWS::EFS::AccessPoint
  SharedStorageEfsSecurityGroup:
    Properties:
      GroupDescription: Security group for EFS mount target (shared_storage)
      Tags:
      - Key: Name
        Value: shared_storage-efs-sg
      VpcId:
        Ref: VpcId
    Type: AWS::EC2::SecurityGroup
  SharedStorageEfsSecurityGroupIngress:
    Properties:
      Description: Allow NFS inbound traffic from Lambda security group
      FromPort: 2049
      GroupId:
        Ref: SharedStorageEfsSecurityGroup
      IpProtocol: tcp
      SourceSecurityGroupId:
        Ref: SharedStorageLambdaSecurityGroup
      ToPort: 2049
    Type: AWS::EC2::SecurityGroupIngress
  SharedStorageLambdaSecurityGroup:
    Properties:
      GroupDescription: Security group for Lambda function to communicate with EFS
        (shared_storage)
      Tags:
      - Key: Name
        Value: shared_storage-lambda-sg
      VpcId:
        Ref: VpcId
    Type: AWS::EC2::SecurityGroup
  SharedStorageLambdaSecurityGroupEgress:
    Properties:
      Description: Allow NFS outbound traffic to EFS security group
      DestinationSecurityGroupId:
        Ref: SharedStorageEfsSecurityGroup
      FromPort: 2049
      GroupId:
        Ref: SharedStorageLambdaSecurityGroup
      IpProtocol: tcp
      ToPort: 2049
    Type: AWS::EC2::SecurityGroupEgress
Outputs:
  ApplicationName:
    Description: Veltrunode application name
    Value: efs-security-group-app
  ApplicationStage:
    Description: Veltrunode application stage
    Value: dev
  ProcessorFunctionArn:
    Description: ARN of processor Lambda function
    Export:
      Name:
        Fn::Sub: "${AWS::StackName}-ProcessorFunctionArn"
    Value:
      Fn::GetAtt:
      - ProcessorFunction
      - Arn
  ProcessorFunctionName:
    Description: Name of processor Lambda function
    Export:
      Name:
        Fn::Sub: "${AWS::StackName}-ProcessorFunctionName"
    Value:
      Ref: ProcessorFunction
  SharedDataAccessPointArn:
    Description: ARN of shared_data managed EFS access point
    Export:
      Name:
        Fn::Sub: "${AWS::StackName}-SharedDataAccessPointArn"
    Value:
      Fn::GetAtt:
      - SharedDataAccessPoint
      - Arn
  SharedStorageEfsSecurityGroupId:
    Description: Security group ID of shared_storage EFS mount target
    Export:
      Name:
        Fn::Sub: "${AWS::StackName}-SharedStorageEfsSecurityGroupId"
    Value:
      Ref: SharedStorageEfsSecurityGroup
  SharedStorageLambdaSecurityGroupId:
    Description: Security group ID of shared_storage Lambda function
    Export:
      Name:
        Fn::Sub: "${AWS::StackName}-SharedStorageLambdaSecurityGroupId"
    Value:
      Ref: SharedStorageLambdaSecurityGroup
