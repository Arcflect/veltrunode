---
AWSTemplateFormatVersion: '2010-09-09'
Description: multi-resource-app - dev (compiled by Veltrunode v0.1.39)
Parameters:
  ArtifactBucket:
    Description: S3 bucket name where function and layer zip packages are stored
    Type: String
Resources:
  AggregateFunction:
    DependsOn:
    - AggregateFunctionLogGroup
    Properties:
      Architectures:
      - arm64
      Code:
        S3Bucket:
          Ref: ArtifactBucket
        S3Key: artifacts/functions/aggregate.zip
      EphemeralStorage:
        Size: 512
      FunctionName: aggregate
      Handler: app.aggregate
      MemorySize: 1024
      ReservedConcurrentExecutions: 5
      Role:
        Fn::GetAtt:
        - AggregateFunctionRole
        - Arn
      Runtime: ruby3.4
      Timeout: 300
    Type: AWS::Lambda::Function
  AggregateFunctionLogGroup:
    Properties:
      LogGroupName: "/aws/lambda/aggregate"
      RetentionInDays: 14
    Type: AWS::Logs::LogGroup
  AggregateFunctionRole:
    Properties:
      AssumeRolePolicyDocument:
        Statement:
        - Action: sts:AssumeRole
          Effect: Allow
          Principal:
            Service: lambda.amazonaws.com
        Version: '2012-10-17'
      Policies:
      - PolicyDocument:
          Statement:
          - Action:
            - logs:CreateLogStream
            - logs:PutLogEvents
            Effect: Allow
            Resource:
            - Fn::GetAtt:
              - AggregateFunctionLogGroup
              - Arn
          Version: '2012-10-17'
        PolicyName: AggregateFunctionRolePolicy
    Type: AWS::IAM::Role
  DailyAggregateSchedule:
    Properties:
      FlexibleTimeWindow:
        Mode: 'OFF'
      ScheduleExpression: cron(0 2 * * ? *)
      ScheduleExpressionTimezone: Asia/Tokyo
      State: ENABLED
      Target:
        Arn:
          Fn::GetAtt:
          - AggregateFunction
          - Arn
        DeadLetterConfig:
          Arn: arn:aws:sqs:ap-northeast-1:123456789012:agg-dlq
        RetryPolicy:
          MaximumEventAgeInSeconds: 3600
          MaximumRetryAttempts: 2
        RoleArn:
          Fn::GetAtt:
          - DailyAggregateScheduleRole
          - Arn
    Type: AWS::Scheduler::Schedule
  DailyAggregateScheduleRole:
    Properties:
      AssumeRolePolicyDocument:
        Statement:
        - Action: sts:AssumeRole
          Effect: Allow
          Principal:
            Service: scheduler.amazonaws.com
        Version: '2012-10-17'
      Policies:
      - PolicyDocument:
          Statement:
          - Action:
            - lambda:InvokeFunction
            Effect: Allow
            Resource:
            - Fn::GetAtt:
              - AggregateFunction
              - Arn
          - Action:
            - sqs:SendMessage
            Effect: Allow
            Resource:
            - arn:aws:sqs:ap-northeast-1:123456789012:agg-dlq
          Version: '2012-10-17'
        PolicyName: DailyAggregateScheduleRolePolicy
    Type: AWS::IAM::Role
  HourlyIngestSchedule:
    Properties:
      FlexibleTimeWindow:
        Mode: 'OFF'
      ScheduleExpression: rate(1 hour)
      ScheduleExpressionTimezone: UTC
      State: ENABLED
      Target:
        Arn:
          Fn::GetAtt:
          - IngestFunction
          - Arn
        Input: '{"source":"scheduler"}'
        RoleArn:
          Fn::GetAtt:
          - HourlyIngestScheduleRole
          - Arn
    Type: AWS::Scheduler::Schedule
  HourlyIngestScheduleRole:
    Properties:
      AssumeRolePolicyDocument:
        Statement:
        - Action: sts:AssumeRole
          Effect: Allow
          Principal:
            Service: scheduler.amazonaws.com
        Version: '2012-10-17'
      Policies:
      - PolicyDocument:
          Statement:
          - Action:
            - lambda:InvokeFunction
            Effect: Allow
            Resource:
            - Fn::GetAtt:
              - IngestFunction
              - Arn
          Version: '2012-10-17'
        PolicyName: HourlyIngestScheduleRolePolicy
    Type: AWS::IAM::Role
  IngestFunction:
    DependsOn:
    - IngestFunctionLogGroup
    Properties:
      Architectures:
      - arm64
      Code:
        S3Bucket:
          Ref: ArtifactBucket
        S3Key: artifacts/functions/ingest.zip
      EphemeralStorage:
        Size: 512
      FunctionName: ingest
      Handler: app.ingest
      MemorySize: 256
      Role:
        Fn::GetAtt:
        - IngestFunctionRole
        - Arn
      Runtime: ruby3.4
      Timeout: 30
    Type: AWS::Lambda::Function
  IngestFunctionLogGroup:
    Properties:
      LogGroupName: "/aws/lambda/ingest"
      RetentionInDays: 14
    Type: AWS::Logs::LogGroup
  IngestFunctionRole:
    Properties:
      AssumeRolePolicyDocument:
        Statement:
        - Action: sts:AssumeRole
          Effect: Allow
          Principal:
            Service: lambda.amazonaws.com
        Version: '2012-10-17'
      Policies:
      - PolicyDocument:
          Statement:
          - Action:
            - logs:CreateLogStream
            - logs:PutLogEvents
            Effect: Allow
            Resource:
            - Fn::GetAtt:
              - IngestFunctionLogGroup
              - Arn
          Version: '2012-10-17'
        PolicyName: IngestFunctionRolePolicy
    Type: AWS::IAM::Role
Outputs:
  AggregateFunctionArn:
    Description: ARN of aggregate Lambda function
    Export:
      Name:
        Fn::Sub: "${AWS::StackName}-AggregateFunctionArn"
    Value:
      Fn::GetAtt:
      - AggregateFunction
      - Arn
  AggregateFunctionName:
    Description: Name of aggregate Lambda function
    Export:
      Name:
        Fn::Sub: "${AWS::StackName}-AggregateFunctionName"
    Value:
      Ref: AggregateFunction
  ApplicationName:
    Description: Veltrunode application name
    Value: multi-resource-app
  ApplicationStage:
    Description: Veltrunode application stage
    Value: dev
  DailyAggregateScheduleArn:
    Description: ARN of daily_aggregate EventBridge schedule
    Export:
      Name:
        Fn::Sub: "${AWS::StackName}-DailyAggregateScheduleArn"
    Value:
      Fn::GetAtt:
      - DailyAggregateSchedule
      - Arn
  HourlyIngestScheduleArn:
    Description: ARN of hourly_ingest EventBridge schedule
    Export:
      Name:
        Fn::Sub: "${AWS::StackName}-HourlyIngestScheduleArn"
    Value:
      Fn::GetAtt:
      - HourlyIngestSchedule
      - Arn
  IngestFunctionArn:
    Description: ARN of ingest Lambda function
    Export:
      Name:
        Fn::Sub: "${AWS::StackName}-IngestFunctionArn"
    Value:
      Fn::GetAtt:
      - IngestFunction
      - Arn
  IngestFunctionName:
    Description: Name of ingest Lambda function
    Export:
      Name:
        Fn::Sub: "${AWS::StackName}-IngestFunctionName"
    Value:
      Ref: IngestFunction
