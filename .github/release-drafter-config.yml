# =============================================================================
# release-drafter/release-drafter configuration
# PRマージ時にドラフトリリースノートを自動生成する
# ラベルベースのセマンティックバージョニング解決付き
# https://github.com/release-drafter/release-drafter
# =============================================================================

name-template: "v$RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"
tag-prefix: "v"

# --- バージョン解決ルール ---
# ラベルが未指定の場合はデフォルトで patch increment
version-resolver:
  default: patch

# --- カテゴリ分類および除外設定 ---
categories:
  # --- 除外ラベル（Changelogから除外するPRに付与するラベル） ---
  - type: "pre-exclude"
    when:
      labels:
        - "skip-changelog"

  - title: "💥 Breaking Changes"
    semver-increment: "major"
    when:
      labels:
        - "semver:major"

  - title: "🚀 Features"
    semver-increment: "minor"
    when:
      labels:
        - "type:feature"
        - "semver:minor"

  - title: "🐛 Bug Fixes"
    semver-increment: "patch"
    when:
      labels:
        - "type:bugfix"
        - "semver:patch"

  - title: "🧰 Maintenance"
    when:
      labels:
        - "type:chore"
        - "area:infra"
        - "area:ci"

  - title: "📖 Documentation"
    when:
      labels:
        - "type:docs"
        - "area:docs"

  - title: "🔒 Security"
    when:
      labels:
        - "area:security"

  - title: "🧪 Testing"
    when:
      labels:
        - "area:testing"

# --- テンプレート ---
change-template: "- $TITLE (#$NUMBER) @$AUTHOR"
change-title-escapes: '\<*_&'

template: |
  ## What's Changed

  $CHANGES

  ## Contributors

  $CONTRIBUTORS

# --- コントリビューター除外 ---
exclude-contributors:
  - "dependabot"
  - "dependabot[bot]"
  - "github-actions[bot]"

# --- ソート ---
sort-by: merged_at
sort-direction: descending
